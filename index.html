<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toolbox</title>
<meta name="theme-color" content="#0a0a0a">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<style>
:root,[data-theme=dark]{--bg:#0a0a0a;--panel:#141414;--panel2:#1d1d1d;--line:#272727;--ink:#f2f2ef;--soft:#8d8d88;--accent:#CAB14D;--accent-ink:#0a0a0a;--acc-t:#CAB14D;--warn:#ef6f63;color-scheme:dark}
[data-theme=light]{--bg:#f4f4f1;--panel:#fff;--panel2:#efefeb;--line:#e1e1da;--ink:#151512;--soft:#6a6a63;--accent:#CAB14D;--accent-ink:#161610;--acc-t:#7a670d;--warn:#b3392f;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:env(safe-area-inset-top) 16px 0}
.bar{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:18px;height:56px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:1.05rem;letter-spacing:-.2px}
.brand i{width:22px;height:22px;border-radius:7px;background:var(--accent);display:block}
nav{display:flex;gap:2px}
nav a{color:var(--soft);text-decoration:none;padding:7px 12px;border-radius:8px;font-weight:600;font-size:.92rem}
nav a:hover{color:var(--ink)}
nav a.on{color:var(--acc-t);background:color-mix(in srgb,var(--accent) 15%,transparent)}
.who{margin-left:auto;display:flex;gap:8px;align-items:center;color:var(--soft);font-size:.82rem}
.who button,#theme{padding:6px 10px;font-size:.85rem}
main{max-width:1100px;margin:0 auto;padding:26px 16px 70px}
h1{font-size:1.9rem;letter-spacing:-.6px;margin:0 0 4px;line-height:1.2}
.h2{font-size:1.05rem;margin:28px 0 0;letter-spacing:-.2px}
.sub{color:var(--soft);margin:0 0 18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
button,.btn{font:inherit;font-weight:600;font-size:.92rem;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:9px 14px;border-radius:9px;cursor:pointer}
button:hover:not(:disabled),.btn:hover{border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.pri:hover:not(:disabled){filter:brightness(1.08)}
button.del{color:var(--warn)}
a{color:var(--acc-t)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 12px;width:100%}
input::placeholder,textarea::placeholder{color:var(--soft)}
textarea{min-height:140px;resize:vertical}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 18px;min-width:110px}
.stats b{display:block;font-size:1.7rem;line-height:1.1;color:var(--acc-t)}
.stats span{color:var(--soft);font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:7px;min-height:130px;text-align:left;color:inherit;text-decoration:none;overflow:hidden;transition:border-color .15s}
.tile:hover{border-color:var(--accent)}
.tile b{font-size:1.02rem;overflow-wrap:anywhere;letter-spacing:-.1px}
.tile small{align-self:flex-start;margin-top:auto;color:var(--acc-t);background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:999px;padding:2px 10px;font-weight:600;font-size:.76rem}
.tile p{margin:0;color:var(--soft);font-size:.9rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile img{width:calc(100% + 28px);margin:-14px -14px 4px;height:120px;object-fit:cover;display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.panel h2{font-size:1rem;margin:0 0 10px}
.list .item{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.list .item:last-child{border:0}
.list span{overflow-wrap:anywhere}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.study{margin-top:18px;text-align:center;max-width:640px;margin-inline:auto}
.flash{background:var(--panel);border:1px solid var(--line);border-radius:18px;min-height:240px;display:flex;align-items:center;justify-content:center;padding:24px;font-size:1.6rem;font-weight:600;letter-spacing:-.3px;cursor:pointer;overflow-wrap:anywhere;user-select:none}
.flash.back{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--panel))}
.prog{color:var(--soft);margin:10px 0}
.empty{color:var(--soft);padding:34px 0;text-align:center}
.tools{position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;gap:4px;overflow-x:auto;margin:12px 0}
.tools button{padding:7px 11px;min-width:38px;flex:none;background:transparent;border-color:transparent}
.tools button:hover{background:var(--panel2);border-color:var(--line)}
.title{font-size:1.8rem;font-weight:700;letter-spacing:-.5px;border:0;background:transparent;padding:6px 0}
.editor{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;min-height:55vh;font-size:1.04rem;line-height:1.7;overflow-wrap:anywhere}
.editor img{max-width:100%;height:auto;border-radius:8px;margin:6px 0}
.editor h2{font-size:1.5rem;line-height:1.3;letter-spacing:-.4px}.editor h3{font-size:1.2rem;line-height:1.3}
.editor blockquote{border-left:3px solid var(--accent);margin:8px 0;padding-left:12px;color:var(--soft)}
.editor mark{background:var(--accent);color:#161610;border-radius:3px;padding:0 2px}
.saved{color:var(--soft);font-size:.85rem}
@media(max-width:560px){.list .item{grid-template-columns:1fr auto}.list .item span+span{grid-column:1;color:var(--soft)}.two{grid-template-columns:1fr}.who span{display:none}.bar{gap:10px}.brand b{display:none}h1{font-size:1.6rem}}
.tile.tool{min-height:96px}
button svg{width:16px;height:16px;vertical-align:-3px;margin-right:6px}
</style>
</head>
<body>
<header><div class="bar"><span class="brand"><i></i><b>Toolbox</b></span>
<nav><a href="#/home" id="n-home">Home</a><a href="#/cards" id="n-cards">Flashcards</a><a href="#/notes" id="n-notes">Notes</a></nav><span class="who" id="who"></span><button id="theme" title="Toggle theme">Theme</button></div></header>
<main id="app"></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,getDoc,getDocs,setDoc,deleteDoc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// ---------- Firebase ----------
const fb=initializeApp({
  apiKey:"AIzaSyBTjTUogNJDAJ2RcSeQgQgNbEQlL8_ONJg",
  authDomain:"toolbox-2f419.firebaseapp.com",
  projectId:"toolbox-2f419",
  storageBucket:"toolbox-2f419.firebasestorage.app",
  messagingSenderId:"290112154686",
  appId:"1:290112154686:web:0a2e6d4e7af229c6a4756f"
});
const auth=getAuth(fb);
const fs=initializeFirestore(fb,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
let me=null;

// ---------- storage: users/{uid}/decks and users/{uid}/notes ----------
const all=async s=>(await getDocs(collection(fs,'users',me,s))).docs.map(d=>d.data());
const get=async(s,id)=>{const d=await getDoc(doc(fs,'users',me,s,id));return d.exists()?d.data():undefined};
const wait=p=>Promise.race([p,new Promise(r=>setTimeout(r,2000))]); // don't hang when offline
const put=(s,v)=>wait(setDoc(doc(fs,'users',me,s,v.id),v));
const del=(s,id)=>wait(deleteDoc(doc(fs,'users',me,s,id)));

// ---------- sign-in ----------
let pending=null;
async function flush(){if(!pending)return;clearTimeout(saveTimer);const f=pending;pending=null;await f()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
addEventListener('pagehide',flush);
function signedOut(){
  app.innerHTML=`<div class="panel" style="max-width:420px;margin:40px auto;text-align:center"><h1>My Toolbox</h1><p class="sub">Sign in to open your flashcards and notes.</p><button class="pri" id="gin">Sign in with Google</button><p class="sub" id="aerr" style="color:var(--warn);margin-top:12px"></p></div>`;
  document.getElementById('gin').onclick=async()=>{
    const p=new GoogleAuthProvider();
    try{await signInWithPopup(auth,p)}
    catch(e){
      if(e.code==='auth/popup-blocked')signInWithRedirect(auth,p);
      else document.getElementById('aerr').textContent='Sign-in failed ('+e.code+')';
    }
  };
}
onAuthStateChanged(auth,u=>{
  me=u?u.uid:null;
  document.querySelector('nav').style.display=u?'':'none';
  const who=document.getElementById('who');
  if(!u){who.innerHTML='';signedOut();return}
  who.innerHTML=`<span>${esc(u.email||'')}</span><button id="out">Sign out</button>`;
  document.getElementById('out').onclick=()=>signOut(auth);
  route();
});

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=document.getElementById('app');
document.getElementById('theme').onclick=()=>{const r=document.documentElement,t=r.dataset.theme==='light'?'dark':'light';r.dataset.theme=t;try{localStorage.setItem('theme',t)}catch(e){}};
let study=null,saveTimer=null;

// ---------- router ----------
async function route(){
  await flush();if(!me)return;
  const [,page,id]=(location.hash||'#/home').split('/');
  document.getElementById('n-home').className=page==='home'?'on':'';
  document.getElementById('n-cards').className=['cards','study'].includes(page)?'on':'';
  document.getElementById('n-notes').className=['notes','note'].includes(page)?'on':'';
  window.scrollTo(0,0);
  if(page==='home')return homeView();
  if(page==='cards'&&id)return deckView(id);
  if(page==='cards')return decksView();
  if(page==='study')return studyView(id);
  if(page==='notes')return notesView();
  if(page==='note')return noteView(id);
  location.hash='#/home';
}
addEventListener('hashchange',route);

// ---------- home ----------
const SVG=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
const backupBtns=k=>`<button data-act="export" data-kind="${k}">${SVG('M12 3v12m0 0l-4-4m4 4l4-4M5 21h14')}Back up</button><button data-act="import">${SVG('M12 15V3m0 0L8 7m4-4l4 4M5 21h14')}Restore</button>`;
async function homeView(){
  const [d,n]=await Promise.all([all('decks'),all('notes')]);
  const items=[...d.map(x=>({...x,kind:'deck'})),...n.map(x=>({...x,kind:'note'}))].sort((a,b)=>(b.updated||0)-(a.updated||0)).slice(0,6);
  const when=t=>t?new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'}):'';
  const tile=x=>{
    if(x.kind==='deck')return `<a class="tile" href="#/cards/${x.id}"><b>${esc(x.name||'Untitled deck')}</b><p>${x.cards.length} card${x.cards.length==1?'':'s'}</p><small>Deck, ${when(x.updated)}</small></a>`;
    const t=document.createElement('div');t.innerHTML=x.html||'';const img=t.querySelector('img');
    return `<a class="tile" href="#/note/${x.id}">${img?`<img src="${img.src}" alt="">`:''}<b>${esc(x.title||'Untitled')}</b><p>${esc(t.textContent.trim())}</p><small>Note, ${when(x.updated)}</small></a>`;
  };
  app.innerHTML=`<h1>Toolbox</h1><p class="sub">Your personal tools, synced to your Google account.</p>
  <h2 class="h2">Tools</h2>
  <div class="grid"><a class="tile tool" href="#/cards"><b>Flashcards</b><p>Make decks, paste in lists, and study.</p></a>
  <a class="tile tool" href="#/notes"><b>Notes</b><p>Rich text notes with photos.</p></a></div>
  <h2 class="h2">Recents</h2>
  ${items.length?`<div class="grid">${items.map(tile).join('')}</div>`:'<div class="empty">Nothing yet. Make a deck or a note and it will show up here.</div>'}`;
}

// ---------- flashcards ----------
async function decksView(){
  const decks=(await all('decks')).sort((a,b)=>b.updated-a.updated);
  app.innerHTML=`<h1>Flashcards</h1><p class="sub">Make decks, paste in lists, and study.</p>
  <div class="row between"><button class="pri" data-act="newdeck">+ New deck</button><span class="row">${backupBtns('decks')}</span></div>
  ${decks.length?`<div class="grid">${decks.map(d=>`<a class="tile" href="#/cards/${d.id}"><b>${esc(d.name||'Untitled deck')}</b><small>${d.cards.length} card${d.cards.length==1?'':'s'}</small></a>`).join('')}</div>`:'<div class="empty">No decks yet. Create one to get started.</div>'}`;
}
async function deckView(id){
  const d=await get('decks',id);if(!d){location.hash='#/cards';return}
  app.innerHTML=`<a href="#/cards" style="color:var(--soft);text-decoration:none">&larr; All decks</a>
  <input class="title" id="dtitle" placeholder="Deck name" value="${esc(d.name)}">
  <div class="row between"><p class="sub" style="margin:0">${d.cards.length} card${d.cards.length==1?'':'s'}</p>
  <div class="row"><button class="pri" data-act="study" data-id="${id}" ${d.cards.length?'':'disabled'}>Study</button><button class="del" data-act="deldeck" data-id="${id}">Delete deck</button></div></div>
  <div class="panel"><h2>Add a card</h2><div class="two"><input id="f" placeholder="Front"><input id="b" placeholder="Back"></div><button class="pri" data-act="addcard" data-id="${id}">Add card</button></div>
  <div class="panel"><h2>Paste a list</h2><p class="sub" style="margin:0 0 8px">One card per line, front and back separated by a comma. Extra commas stay in the back.</p>
  <textarea id="bulk" placeholder="hola, hello&#10;gracias, thank you"></textarea><div class="row" style="margin-top:8px"><button class="pri" data-act="bulk" data-id="${id}">Import cards</button></div></div>
  <div class="panel list"><h2>Cards</h2>${d.cards.length?d.cards.map((c,i)=>`<div class="item"><span>${esc(c.f)}</span><span>${esc(c.b)}</span><span class="row"><button data-act="editcard" data-id="${id}" data-i="${i}">Edit</button><button class="del" data-act="delcard" data-id="${id}" data-i="${i}">Delete</button></span></div>`).join(''):'<div class="empty">This deck is empty.</div>'}</div>`;
  const ti=document.getElementById('dtitle');if(!d.name)ti.focus();
  ti.addEventListener('input',()=>{clearTimeout(saveTimer);pending=async()=>{const x=await get('decks',id);if(!x)return;x.name=ti.value;x.updated=Date.now();await put('decks',x)};saveTimer=setTimeout(flush,600)});
}
async function studyView(id){
  const d=await get('decks',id);if(!d||!d.cards.length){location.hash='#/cards/'+id;return}
  if(!study||study.id!==id)study={id,q:[...d.cards].sort(()=>Math.random()-.5),total:d.cards.length,done:0,flip:false};
  drawStudy(d);
}
function drawStudy(d){
  const s=study;
  if(!s.q.length){app.innerHTML=`<h1>${esc(d.name||'Untitled deck')}</h1><div class="empty">All ${s.total} cards done.</div><div class="row" style="justify-content:center"><button class="pri" data-act="restart" data-id="${s.id}">Study again</button><a class="btn" href="#/cards/${s.id}" style="text-decoration:none">Back to deck</a></div>`;return}
  const c=s.q[0];
  app.innerHTML=`<div class="row between"><h1>${esc(d.name||'Untitled deck')}</h1><a href="#/cards/${s.id}" style="color:var(--soft)">Exit</a></div>
  <div class="study"><div class="prog">${s.done} of ${s.total} known · ${s.q.length} left</div>
  <div class="flash ${s.flip?'back':''}" data-act="flip" tabindex="0">${esc(s.flip?c.b:c.f)}</div>
  <p class="sub" style="margin-top:10px">${s.flip?'Did you know it?':'Tap the card to see the answer'}</p>
  <div class="row" style="justify-content:center">${s.flip?'<button class="del" data-act="again">Again</button><button class="pri" data-act="got">Got it</button>':'<button data-act="flip">Show answer</button>'}</div></div>`;
}

// ---------- notes ----------
async function notesView(){
  const notes=(await all('notes')).sort((a,b)=>b.updated-a.updated);
  app.innerHTML=`<h1>Notes</h1><p class="sub">Tap a note to open it.</p><div class="row between"><button class="pri" data-act="newnote">+ New note</button><span class="row">${backupBtns('notes')}</span></div>
  ${notes.length?`<div class="grid">${notes.map(n=>{const t=document.createElement('div');t.innerHTML=n.html;const img=t.querySelector('img');return `<a class="tile" href="#/note/${n.id}">${img?`<img src="${img.src}" alt="">`:''}<b>${esc(n.title||'Untitled')}</b><p>${esc(t.textContent.trim())}</p><small>${new Date(n.updated).toLocaleDateString()}</small></a>`}).join('')}</div>`:'<div class="empty">No notes yet.</div>'}`;
}
async function noteView(id){
  const n=await get('notes',id);if(!n){location.hash='#/notes';return}
  const B=(cmd,label,arg,title)=>`<button data-cmd="${cmd}" ${arg?`data-arg="${arg}"`:''} title="${title||label}">${label}</button>`;
  app.innerHTML=`<div class="row between"><a href="#/notes" style="color:var(--soft)">&larr; All notes</a><span class="saved" id="saved">Saved</span></div>
  <input class="title" id="ntitle" placeholder="Title" value="${esc(n.title)}">
  <div class="tools">${B('undo','Undo')}${B('redo','Redo')}${B('formatBlock','H1','h2','Heading')}${B('formatBlock','H2','h3','Subheading')}${B('formatBlock','Text','p','Normal text')}
  ${B('bold','<b>B</b>','','Bold')}${B('italic','<i>I</i>','','Italic')}${B('underline','<u>U</u>','','Underline')}${B('strikeThrough','<s>S</s>','','Strikethrough')}${B('hiliteColor','Mark','#ffe66d','Highlight')}
  ${B('insertUnorderedList','&bull; List')}${B('insertOrderedList','1. List')}${B('formatBlock','Quote','blockquote')}${B('justifyLeft','Left')}${B('justifyCenter','Center')}
  <button data-act="link">Link</button><button data-act="photo">Photo</button><button data-cmd="removeFormat">Clear</button></div>
  <div class="editor" id="ed" contenteditable="true">${n.html}</div>
  <input type="file" id="pic" accept="image/*" hidden>
  <div class="row" style="margin-top:14px"><button class="del" data-act="delnote" data-id="${id}">Delete note</button></div>`;
  const ed=document.getElementById('ed'),ti=document.getElementById('ntitle'),sv=document.getElementById('saved');
  const save=()=>{sv.textContent='Saving…';clearTimeout(saveTimer);
    pending=async()=>{const note={id,title:ti.value,html:ed.innerHTML,updated:Date.now()};
      if(note.html.length>900000){sv.textContent='Too big to save. Remove a photo.';return}
      try{await put('notes',note);sv.textContent='Saved'}catch(e){sv.textContent='Not saved ('+(e.code||'error')+')'}};
    saveTimer=setTimeout(flush,600)};
  ed.addEventListener('input',save);ti.addEventListener('input',save);if(!n.title)ti.focus();
  document.getElementById('pic').addEventListener('change',async e=>{
    const f=e.target.files[0];if(!f)return;ed.focus();
    document.execCommand('insertImage',false,await shrink(f));save();e.target.value='';
  });
}
function shrink(file,max=900){return new Promise(ok=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.7))};i.src=r.result};r.readAsDataURL(file)})}

// ---------- events ----------
document.addEventListener('mousedown',e=>{if(e.target.closest('.tools button'))e.preventDefault()});
document.addEventListener('click',async e=>{
  const cm=e.target.closest('[data-cmd]');
  if(cm){document.getElementById('ed').focus();document.execCommand(cm.dataset.cmd,false,cm.dataset.arg||null);document.getElementById('ed').dispatchEvent(new Event('input'));return}
  const t=e.target.closest('[data-act]');if(!t)return;
  const {act,id,i}=t.dataset;
  await flush();
  if(act==='newdeck'){const d={id:uid(),name:'',cards:[],updated:Date.now()};await put('decks',d);location.hash='#/cards/'+d.id}
  else if(act==='deldeck'){if(confirm('Delete this deck and all its cards?')){await del('decks',id);location.hash='#/cards'}}
  else if(act==='addcard'){const f=document.getElementById('f').value.trim(),b=document.getElementById('b').value.trim();if(!f||!b)return alert('Fill in both sides.');const d=await get('decks',id);d.cards.push({f,b});d.updated=Date.now();await put('decks',d);deckView(id)}
  else if(act==='bulk'){
    const d=await get('decks',id);let n=0,skipped=0;
    document.getElementById('bulk').value.split(/\r?\n/).forEach(line=>{
      if(!line.trim())return;const k=line.search(/,|\t/);
      if(k<1){skipped++;return}
      const f=line.slice(0,k).trim(),b=line.slice(k+1).trim();
      if(f&&b){d.cards.push({f,b});n++}else skipped++;
    });
    d.updated=Date.now();await put('decks',d);await deckView(id);
    alert(`Imported ${n} card${n==1?'':'s'}.`+(skipped?` Skipped ${skipped} line${skipped==1?'':'s'} with no comma.`:''));
  }
  else if(act==='editcard'){const d=await get('decks',id),c=d.cards[i];const f=prompt('Front',c.f);if(f===null)return;const b=prompt('Back',c.b);if(b===null)return;if(f.trim()&&b.trim()){d.cards[i]={f:f.trim(),b:b.trim()};d.updated=Date.now();await put('decks',d);deckView(id)}}
  else if(act==='delcard'){const d=await get('decks',id);d.cards.splice(i,1);d.updated=Date.now();await put('decks',d);deckView(id)}
  else if(act==='study'){study=null;location.hash='#/study/'+id}
  else if(act==='restart'){study=null;studyView(id)}
  else if(act==='flip'){study.flip=!study.flip;drawStudy(await get('decks',study.id))}
  else if(act==='got'){study.q.shift();study.done++;study.flip=false;drawStudy(await get('decks',study.id))}
  else if(act==='again'){study.q.push(study.q.shift());study.flip=false;drawStudy(await get('decks',study.id))}
  else if(act==='newnote'){const n={id:uid(),title:'',html:'',updated:Date.now()};await put('notes',n);location.hash='#/note/'+n.id}
  else if(act==='delnote'){if(confirm('Delete this note?')){pending=null;clearTimeout(saveTimer);await del('notes',id);location.hash='#/notes'}}
  else if(act==='link'){const u=prompt('Link address (https://…)');if(u){document.getElementById('ed').focus();document.execCommand('createLink',false,u);document.getElementById('ed').dispatchEvent(new Event('input'))}}
  else if(act==='photo'){document.getElementById('pic').click()}
  else if(act==='export'){
    const k=t.dataset.kind,data=JSON.stringify({[k]:await all(k)});
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
    a.download='toolbox-'+(k==='decks'?'flashcards':'notes')+'-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
  }
  else if(act==='import'){const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=async()=>{try{const j=JSON.parse(await inp.files[0].text());for(const d of j.decks||[])await put('decks',d);for(const n of j.notes||[])await put('notes',n);alert('Backup restored.');route()}catch{alert('That file is not a valid backup.')}};inp.click()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('flash'))e.target.click()});
</script>
</body>
</html>
