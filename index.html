<script type="module">

// ---------- sign-in ----------

async function flush(){if(!pending)return;clearTimeout(saveTimer);const f=pending;pending=null;await f()}

})}

// ---------- levels and XP ----------
const blankProf=()=>({xp:0,xpBy:{},stats:{}});
let PROF=blankProf(),MULT={total:1,parts:[]},ME_EMAIL='',xpPend=null,xpTimer=null,bigUntil=0,toastEl=null,toastTimer=null,toastSum=0;
// XP needed to go from level L to L+1: about 20 minutes of use at level 1, rising slowly to about an hour at level 50
const needFor=L=>Math.round(12*(20+40*(L-1)/49)/5)*5;
function levelInfo(xp){let L=1,r=xp;while(r>=needFor(L)){r-=needFor(L);L++}return {level:L,cur:r,need:needFor(L)}}
const fmtXp=n=>n>=10?Math.round(n).toLocaleString():String(Math.round(n*10)/10);
const countBonus=n=>n>=50?1.5:n>=20?1.25:n>=10?1.1:1;
const SENS={0.7:1.3,1:1,1.5:0.9,2.2:0.8};
// each habit adds 0.01 per streak day, up to +0.50 (a 50 day streak); the bonuses add together
function calcMult(habits){
  const parts=habits.map(h=>{const st=hstats(h).cur;return {name:h.name||'Untitled habit',streak:st,bonus:Math.min(st*0.01,0.5)}}).filter(p=>p.bonus>0).sort((a,b)=>b.bonus-a.bonus);
  return {total:Math.round((1+parts.reduce((a,p)=>a+p.bonus,0))*100)/100,parts};
}
async function refreshMult(){try{MULT=calcMult(await all('habits'))}catch(e){}}
async function loadProfile(){
  if(!me)return;
  try{
    await flushXp();
    const d=await get('profile','main');
    PROF={...blankProf(),...(d||{})};PROF.xpBy=PROF.xpBy||{};PROF.stats=PROF.stats||{};
  }catch(e){}
  paintXp();
}
function paintXp(){
  const li=levelInfo(PROF.xp),f=document.getElementById('xpfill'),b=document.getElementById('xpbar');if(!f||!b)return;
  f.style.width=Math.min(100,li.cur/li.need*100)+'%';
  b.title='Level '+li.level+': '+Math.floor(li.cur)+' / '+li.need+' XP';b.setAttribute('aria-valuenow',Math.round(li.cur/li.need*100));
}
function queueXp(tool,gain,stats){
  xpPend=xpPend||{xp:0,xpBy:{},stats:{}};
  xpPend.xp+=gain;xpPend.xpBy[tool]=(xpPend.xpBy[tool]||0)+gain;
  for(const k in stats)xpPend.stats[k]=(xpPend.stats[k]||0)+stats[k];
  clearTimeout(xpTimer);xpTimer=setTimeout(flushXp,2000);
}
async function flushXp(){
  if(!xpPend||!me)return;
  const p=xpPend;xpPend=null;clearTimeout(xpTimer);
  const data={xp:increment(p.xp),xpBy:{},stats:{}};
  for(const k in p.xpBy)data.xpBy[k]=increment(p.xpBy[k]);
  for(const k in p.stats)data.stats[k]=increment(p.stats[k]);
  try{await wait(setDoc(doc(fs,'users',me,'profile','main'),data,{merge:true}))}
  catch(e){xpPend=xpPend||{xp:0,xpBy:{},stats:{}};xpPend.xp+=p.xp;for(const k in p.xpBy)xpPend.xpBy[k]=(xpPend.xpBy[k]||0)+p.xpBy[k];for(const k in p.stats)xpPend.stats[k]=(xpPend.stats[k]||0)+p.stats[k]}
}
function toast(html,cls=''){
  if(!toastEl){toastEl=document.createElement('div');document.body.appendChild(toastEl)}
  toastEl.className='toast '+cls;toastEl.innerHTML=html;toastEl.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toastEl.hidden=true;toastSum=0},cls==='big'?3200:1400);
}
// base XP in, streak multiplier applied, XP out
function award(tool,base,stats){
  const gain=base*MULT.total,before=levelInfo(PROF.xp).level;
  PROF.xp+=gain;PROF.xpBy[tool]=(PROF.xpBy[tool]||0)+gain;
  for(const k in (stats||{}))PROF.stats[k]=(PROF.stats[k]||0)+stats[k];
  queueXp(tool,gain,stats||{});paintXp();
  if(gain>0){
    const after=levelInfo(PROF.xp).level;
    if(after>before){bigUntil=Date.now()+3200;toast('Level up! You are now level '+after,'big')}
    else if(Date.now()>bigUntil){toastSum+=gain;toast('+'+fmtXp(toastSum)+' XP'+(MULT.total>1?' <small>x'+MULT.total.toFixed(2)+'</small>':''))}
  }
  return gain;
}
// Test XP: base per question, then bonuses for the options chosen
const testBase=it=>it.method==='mc'?2:it.method==='type'?3:5*writeChars(it.dir==='front'?it.b:it.f).length;
function testMult(r){
  const c=r.cfg,withCards=testDecks.filter(d=>d.cards.length).length;
  let scope=1;if(c.mode==='random')scope=1.25;else if(withCards>1&&c.decks.length>=withCards)scope=1.25;else if(c.decks.length>=2)scope=1.1;
  return (c.method==='mixed'?1.25:1)*scope*(c.dir==='both'?1.1:1)*countBonus(r.items.length);
}

// ---------- notifications (in-site only) ----------
let NOTIFS=[],syncing=false;
async function syncNotifs(){
  if(!me||syncing)return;syncing=true;
  try{
    const [decks,ns]=await Promise.all([all('decks'),all('notifications')]);
    const today=ymd(new Date()),now=Date.now(),ids=new Set(decks.map(d=>d.id)),jobs=[];
    let list=ns.filter(n=>{if(!ids.has(n.deckId)||now-n.created>30*DAY){jobs.push(del('notifications',n.id));return false}return true});
    for(const d of decks){
      const due=d.cards.filter(c=>(c.due||0)<=now).length,name=d.name||'Untitled deck';
      const mine=list.filter(n=>n.deckId===d.id),unread=mine.find(n=>!n.read);
      const text=due+' card'+(due==1?'':'s')+' due';
      if(due>0){
        if(unread){if(unread.text!==text||unread.name!==name){unread.text=text;unread.name=name;jobs.push(put('notifications',unread))}}
        else if(!mine.some(n=>n.day===today)){const n={id:'n-'+d.id+'-'+today,type:'due',deckId:d.id,name,day:today,text,created:now,read:false};list.push(n);jobs.push(put('notifications',n))}
      }else if(unread){jobs.push(del('notifications',unread.id));list=list.filter(n=>n!==unread)}
    }
    await Promise.all(jobs);
    NOTIFS=list.sort((a,b)=>b.created-a.created);
  }catch(e){}
  syncing=false;paintBell();
}
function paintBell(){
  const list=NOTIFS.filter(n=>!n.dismissed),un=list.filter(n=>!n.read).length,b=document.getElementById('badge'),today=ymd(new Date());
  b.hidden=!un;b.textContent=un>9?'9+':un;
  document.getElementById('notifs').innerHTML=`<div class="nhead"><span>Notifications</span><span class="row"><button data-act="nreadall" ${un?'':'disabled'}>Mark all read</button><button data-act="nclear" ${list.length?'':'disabled'}>Clear all</button></span></div>`
   +(list.length?list.map(n=>`<div class="nitem ${n.read?'read':'unread'}"><i class="dot"></i><a class="txt" href="#/study/${n.deckId}" data-act="nread" data-id="${n.id}"><b>${esc(n.name)}</b><span>${esc(n.text)}</span><small>${n.day===today?'Today':new Date(n.created).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</small></a><button class="nx" data-act="ndismiss" data-id="${n.id}" aria-label="Dismiss">&times;</button></div>`).join(''):'<div class="empty" style="padding:22px 14px">No notifications</div>');
}

async function route(){
  await flush();if(!me)return;
  if((location.hash||'#/home').split('/')[1]!=='study')study=null;

  const [,page,id]=(location.hash||'#/home').split('/');

  document.getElementById('n-tools').className='navbtn'+(['cards','folder','study','test','write','convos','convo','convoedit','notes','note','habits','habit'].includes(page)?' on':'');
  if(page==='home')return homeView();
  if(page==='profile')return profileView();
  if(page==='folder')return folderView(id);
  if(page==='cards'&&id)return deckView(id);
  if(page==='cards')return decksView();
  if(page==='study')return studyView(id);
  if(page==='test')return testView();
  if(page==='write')return writeView();
  if(page==='convos')return convosView();
  if(page==='convo')return convoView(id);
  if(page==='convoedit')return convoEdit(id);
  if(page==='habits')return habitsView();
  if(page==='habit')return habitView(id);

  if(page==='note')return noteView(id);

}

// ---------- profile ----------
async function profileView(){
  const [decks,notes,habits]=await Promise.all([all('decks'),all('notes'),all('habits')]);
  MULT=calcMult(habits);
  const li=levelInfo(PROF.xp),pct=Math.min(100,li.cur/li.need*100),st=PROF.stats||{},by=PROF.xpBy||{};
  const cardsN=decks.reduce((a,d)=>a+d.cards.length,0),checks=habits.reduce((a,h)=>a+Object.keys(h.log||{}).length,0),best=habits.reduce((m,h)=>Math.max(m,hstats(h).best),0);
  const blk=(v,l)=>`<div><b>${v}</b><span>${l}</span></div>`,pc=(c,t)=>t?Math.round((c||0)/t*100)+'%':'none yet',n=x=>(Math.round(x||0)).toLocaleString();
  app.innerHTML=`<h1>Profile</h1><p class="sub">${esc(ME_EMAIL)}</p>
  <div class="panel"><div class="row between" style="align-items:flex-end;flex-wrap:nowrap"><div class="lvlbig"><span>Level</span><b>${li.level}</b></div><div style="text-align:right"><div class="xpnum"><b>${n(Math.floor(li.cur))}</b> / ${n(li.need)} XP</div><div class="sub" style="margin:0">${n(Math.ceil(li.need-li.cur))} XP to level ${li.level+1}</div></div></div>
  <div class="pbar"><i style="width:${pct}%"></i></div><p class="sub" style="margin:10px 0 0">${n(PROF.xp)} XP earned in total</p></div>

const SVG=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const ALLD=[0,1,2,3,4,5,6],CHECK='M5 12l5 5L20 7',FLAME='M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z';
function hstats(h){
  const sched=h.sched&&h.sched.length?h.sched:ALLD,log=h.log||{};
  let cur=0;const d=new Date();d.setHours(12,0,0,0);
  for(let i=0;i<4000;i++){if(sched.includes(d.getDay())){if(log[ymd(d)])cur++;else if(i>0)break}d.setDate(d.getDate()-1)}
  const keys=Object.keys(log).sort();let best=0,run=0;
  if(keys.length){const x=new Date(keys[0]+'T12:00:00'),end=new Date();end.setHours(12,0,0,0);
    for(;x<=end;x.setDate(x.getDate()+1)){if(!sched.includes(x.getDay()))continue;if(log[ymd(x)]){run++;if(run>best)best=run}else run=0}}
  let sc=0,dn=0;const t=new Date();t.setHours(12,0,0,0);
  for(let i=0;i<30;i++){if(sched.includes(t.getDay())){sc++;if(log[ymd(t)])dn++}t.setDate(t.getDate()-1)}
  return {cur,best,total:keys.length,rate:sc?Math.round(dn/sc*100):0};
}

const TACT=['tsens','tgive','tmode','tfolder','tdeck','tall','tnone','tdir','tmethod','tcount','tstart','tpick','tcheck','tskip','tnext','tquit','tretry','tnew'];
async function testAct(act,t){
  const c=testCfg,v=t.dataset.v;
  if(act==='tmode')c.mode=v;
  else if(act==='tdeck'){const id=t.dataset.id;c.decks=c.decks.includes(id)?c.decks.filter(x=>x!==id):[...c.decks,id]}
  else if(act==='tfolder'){const ids=testDecks.filter(d=>d.folder===t.dataset.id&&d.cards.length).map(d=>d.id),every=ids.every(x=>c.decks.includes(x));c.decks=every?c.decks.filter(x=>!ids.includes(x)):[...new Set([...c.decks,...ids])]}
  else if(act==='tall')c.decks=testDecks.filter(d=>d.cards.length).map(d=>d.id);
  else if(act==='tnone')c.decks=[];
  else if(act==='tdir')c.dir=v;
  else if(act==='tmethod')c.method=v;
  else if(act==='tsens')c.sens=+v;
  else if(act==='tcount'){const n=v==='all'?'all':+v;if(c.mode==='random')c.nRandom=n;else c.nPick=n}
  if(['tmode','tfolder','tdeck','tall','tnone','tdir','tmethod','tcount','tsens'].includes(act)){saveCfg();drawSetup();return}
  if(act==='tstart'||act==='tnew'){T=buildTest();if(T)drawTest();else drawSetup();return}
  if(act==='tquit'){
    if(T&&T.i<T.items.length&&T.results.length&&!(await confirmBox('Leave this test? Your progress will be lost.')))return;
    T=null;drawSetup();return;
  }
  const r=T;if(!r)return;
  if(act==='tretry'){const base=r.results.filter(x=>!x.ok).map(x=>({deck:x.deck,f:x.f,b:x.b}));T=makeRun(shuffle(base),r.pool,r.cfg);T.showDeck=r.showDeck;drawTest();return}
  if(act==='tnext'){r.i++;r.cur=null;drawTest();return}
  const it=r.items[r.i],cu=r.cur,q=it.dir==='front'?it.f:it.b,a=it.dir==='front'?it.b:it.f;
  const rec=(ok,given)=>{const g=award('test',testBase(it)*testMult(r)*(ok?1:0.25),{testQs:1,testCorrect:ok?1:0});r.xp+=g;r.results.push({q,a,given,ok,dir:it.dir,deck:it.deck,f:it.f,b:it.b})};
  if(act==='tpick'){if(cu.pick!==null)return;cu.pick=+t.dataset.i;const o=cu.opts[cu.pick];rec(o.ok,o.t);drawTest()}
  else if(act==='tcheck'){if(cu.verdict!==null)return;const inp=document.getElementById('tans'),val=inp?inp.value:'';if(!val.trim()){if(inp)inp.focus();return}cu.given=val;cu.verdict=judge(val,a);rec(cu.verdict!=='wrong',val);drawTest()}
  else if(act==='tgive'){
    if(cu.verdict!==null)return;const w=cu.w;cu.verdict='wrong';r.xp+=award('test',5*(w?w.chars.length:1)*0.25*testMult(r),{testQs:1});
    r.results.push({q,a,given:'',ok:false,warn:[],dir:it.dir,deck:it.deck,f:it.f,b:it.b});
    try{if(w&&w.writer){w.writer.cancelQuiz();w.writer.showCharacter()}}catch(e){}
    writeFeedback(false);
  }
  else if(act==='tskip'){if(cu.verdict!==null)return;cu.given='';cu.verdict='wrong';rec(false,'');drawTest()}
}

const WACT=['wfolder','wdeck','whints','wsens','word','wstart','wagain','whint','wshow','wskip','wnext','wquit','wretry'];
async function writeAct(act,t){
  const c=wCfg,v=t.dataset.v;
  if(act==='wdeck'||act==='wfolder'||act==='whints'||act==='wsens'||act==='word'){
    if(act==='wdeck'){c.deck=t.dataset.id;c.folder=null}else if(act==='wfolder'){c.folder=t.dataset.id;c.deck=null}else if(act==='whints')c.hints=v;else if(act==='wsens')c.sens=+v;else c.order=v;

  }

  }

  else if(act==='wskip'){r.skipped++;r.i++;r.cur=null;drawWrite()}
  else if(act==='wretry'){r.cur=null;drawWrite()}
  else if(act==='whint'){const w=r.cur;if(w&&w.writer&&!w.finished)try{w.writer.highlightStroke(w.next)}catch(e){}}
  else if(act==='wshow'){
    const w=r.cur;if(!w||!w.writer||w.finished)return;
    try{await w.writer.animateCharacter()}catch(e){}

}

const GAP=/[\[\uFF3B]([^\]\uFF3D]+)[\]\uFF3D]/g;
// one line per turn; "A:" / "B:" at the start picks the speaker, otherwise the speakers alternate
function parseScript(text){
  const out=[];let next='A';
  String(text||'').split(/\r?\n/).forEach(raw=>{
    const l=raw.trim();if(!l)return;
    const m=l.match(/^([ABab])\s*[:\uFF1A.\uFF0E)\uFF09]\s*(.*)$/);
    const who=m?m[1].toUpperCase():next,body=(m?m[2]:l).trim();
    if(!body)return;out.push({who,text:body});next=who==='A'?'B':'A';
  });
  return out;
}
const segs=text=>{const out=[];let last=0;for(const m of text.matchAll(GAP)){if(m.index>last)out.push({t:'text',v:text.slice(last,m.index)});out.push({t:'gap',v:m[1].trim()});last=m.index+m[0].length}if(last<text.length)out.push({t:'text',v:text.slice(last)});return out};
const gapCount=text=>parseScript(text).reduce((a,l)=>a+segs(l.text).filter(x=>x.t==='gap').length,0);
const bankLabel=a=>a.split(/\s*[;|\/]\s*/)[0].replace(BR,' ').replace(/\s+/g,' ').trim()||a;
const gapWidth=a=>Math.max(5,[...a].reduce((n,c)=>n+(c.charCodeAt(0)>255?2:1),0)+2);
function convoTile(c){
  const n=parseScript(c.script).length,g=gapCount(c.script);
  return `<div class="deckwrap"><a class="tile" href="#/convo/${c.id}"><b>${esc(c.name||'Untitled conversation')}</b>${c.desc?`<p>${esc(c.desc)}</p>`:''}<div class="pills"><span class="pill">${n} line${n==1?'':'s'}</span><span class="pill">${g} gap${g==1?'':'s'}</span></div></a><div class="menuwrap">${dotsBtn('Conversation options')}<div class="menu"><a href="#/convoedit/${c.id}">Edit</a><button class="del" data-act="askdelc" data-id="${c.id}">Delete</button></div></div></div>`;
}
async function convosView(){
  const cs=(await all('convos')).sort((a,b)=>(b.updated||0)-(a.updated||0));
  app.innerHTML=`<h1>Conversations</h1><p class="sub">Practise A/B scripts by filling in the missing words.</p>
  <div class="row between"><button class="pri" data-act="newconvo">+ New conversation</button><span class="row">${backupBtns('convos')}</span></div>
  ${cs.length?`<div class="grid">${cs.map(convoTile).join('')}</div>`:'<div class="empty">No conversations yet. Create one and paste in a script.</div>'}`;
}
const bubbles=(lines,gapHtml)=>lines.map(l=>`<div class="msg ${l.who==='A'?'a':'b'}"><span class="who">${l.who}</span><div class="bub">${segs(l.text).map(x=>x.t==='text'?esc(x.v):gapHtml(x.v)).join('')}</div></div>`).join('');

let CV=null;
const convoMode=()=>{try{return localStorage.getItem('convoMode')==='bank'?'bank':'type'}catch(e){return 'type'}};
function makeConvo(c,mode){
  const lines=parseScript(c.script),gaps=[];
  const L=lines.map(l=>({who:l.who,segs:segs(l.text).map(x=>x.t==='gap'?(gaps.push({answer:x.v,val:'',chip:null,res:null}),{t:'gap',i:gaps.length-1}):x)}));
  const bank=shuffle(gaps.map((g,i)=>({id:i,label:bankLabel(g.answer),used:false})));
  return {id:c.id,c,L,gaps,bank,mode,checked:false,score:0,xp:0};
}

function drawConvo(){
  const v=CV,c=v.c,n=v.gaps.length,empty=v.gaps.filter(g=>g.chip===null).length,bk=id=>v.bank.find(x=>x.id===id);
  const seg=`<div class="ctl" style="justify-content:flex-start;margin:12px 0"><div class="seg"><button class="${v.mode==='type'?'on':''}" data-act="cmode" data-v="type">Type the words</button><button class="${v.mode==='bank'?'on':''}" data-act="cmode" data-v="bank">Word bank</button></div></div>`;
  const gapHtml=i=>{
    const g=v.gaps[i],w=gapWidth(bankLabel(g.answer)),cls=g.res?(g.res==='ok'?'ok':'bad'):'';
    const fix=g.res==='bad'?`<span class="fix">${esc(bankLabel(g.answer))}</span>`:'';
    if(v.mode==='type')return `<input class="gap ${cls}" data-g="${i}" value="${esc(g.val)}" style="width:${w}ch" ${v.checked?'readonly':''} autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Gap ${i+1}">${fix}`;
    const label=g.chip!==null?esc(bk(g.chip).label):'';
    return `<button class="gap ${cls} ${g.chip===null?'':'filled'}" data-act="cslot" data-g="${i}" style="min-width:${w}ch" ${v.checked?'disabled':''} aria-label="Gap ${i+1}">${label||'&nbsp;'}</button>${fix}`;
  };
  const chat=v.L.length?`<div class="chat">${v.L.map(l=>`<div class="msg ${l.who==='A'?'a':'b'}"><span class="who">${l.who}</span><div class="bub">${l.segs.map(x=>x.t==='text'?esc(x.v):(x.t==='gap'?gapHtml(x.i):'')).join('')}</div></div>`).join('')}</div>`:'<div class="empty">This conversation has no script yet.</div>';
  let foot='';
  if(!n&&v.L.length)foot='<div class="empty">No gaps yet. Put the words to hide in [square brackets] in the script.</div>';
  else if(n&&!v.checked){
    foot=(v.mode==='bank'?`<div class="bank">${v.bank.filter(b=>!b.used).map(b=>`<button class="chipw" data-act="cchip" data-b="${b.id}">${esc(b.label)}</button>`).join('')||'<span class="sub" style="margin:0">All words placed. Tap a filled gap to take its word back.</span>'}</div>`:'')
      +`<div class="row" style="justify-content:center;margin-top:14px"><button class="pri" data-act="ccheck" ${v.mode==='bank'&&empty?'disabled':''}>Check answers</button></div>`;
  }else if(n){
    foot=`<div class="panel" style="text-align:center"><div class="score">${v.score}/${n}</div><p class="sub">${v.score===n?'Perfect. ':''}gaps correct${v.xp?`, +${fmtXp(v.xp)} XP`:''}</p><div class="row" style="justify-content:center"><button class="pri" data-act="cagain">Try again</button><a class="btn" href="#/convoedit/${c.id}" style="text-decoration:none">Edit script</a></div></div>`;
  }
  app.innerHTML=`<div class="row between" style="align-items:flex-start"><div style="min-width:0"><h1>${esc(c.name||'Untitled conversation')}</h1>${c.desc?`<p class="sub pre" style="margin:0">${esc(c.desc)}</p>`:''}</div>${BACK('#/convos')}</div>${n?seg:''}${chat}${foot}`;
}
const CACT=['cmode','cchip','cslot','ccheck','cagain'];
function convoAct(act,t){
  const v=CV;if(!v)return;const bk=id=>v.bank.find(x=>x.id===id);
  if(act==='cmode'){try{localStorage.setItem('convoMode',t.dataset.v)}catch(e){}CV=makeConvo(v.c,t.dataset.v);drawConvo()}
  else if(act==='cagain'){CV=makeConvo(v.c,v.mode);drawConvo()}
  else if(act==='cchip'){const b=bk(+t.dataset.b),gi=v.gaps.findIndex(g=>g.chip===null);if(!b||b.used||gi<0||v.checked)return;v.gaps[gi].chip=b.id;b.used=true;drawConvo()}
  else if(act==='cslot'){const g=v.gaps[+t.dataset.g];if(v.checked||!g||g.chip===null)return;bk(g.chip).used=false;g.chip=null;drawConvo()}
  else if(act==='ccheck'){
    if(v.checked)return;
    if(v.mode==='type')document.querySelectorAll('input.gap[data-g]').forEach(inp=>{v.gaps[+inp.dataset.g].val=inp.value});
    let ok=0,base=0;const per=v.mode==='type'?3:2;
    v.gaps.forEach(g=>{
      const given=v.mode==='type'?g.val:(g.chip!==null?bk(g.chip).label:'');
      g.res=given.trim()&&judge(given,g.answer)!=='wrong'?'ok':'bad';
      if(g.res==='ok'){ok++;base+=per}else base+=per*0.25;
    });
    v.checked=true;v.score=ok;
    v.xp=award('convo',base*countBonus(v.gaps.length),{convoGaps:v.gaps.length,convoCorrect:ok,convoDone:ok===v.gaps.length?1:0});
    drawConvo();
  }
}

    alert(`Imported ${n} card${n==1?'':'s'}.`+(skipped?` Skipped ${skipped} line${skipped==1?'':'s'} with no comma.`:''));
  }
  else if(act==='editcard'){const d=await get('decks',id),c=d.cards[i];const f=prompt('Front',c.f);if(f===null)return;const b=prompt('Back',c.b);if(b===null)return;if(f.trim()&&b.trim()){d.cards[i]={...c,f:f.trim(),b:b.trim()};d.updated=Date.now();await put('decks',d);deckView(id)}}
  else if(act==='delcard'){const d=await get('decks',id);d.cards.splice(i,1);d.updated=Date.now();await put('decks',d);deckView(id)}
  else if(act==='study'){location.hash='#/study/'+id}
  else if(act==='restart'){const m=study?study.mode:'due',d=await get('decks',id);ensureKeys(d);study=startStudy(d,m);drawStudy()}
  else if(act==='smode'){study=startStudy(study.deck,t.dataset.v);drawStudy()}
  else if(act==='sstyle'){study.style=t.dataset.v;try{localStorage.setItem('studyStyle',t.dataset.v)}catch(e){}study.flip=false;study.pick=null;study.opts=null;drawStudy()}
  else if(act==='flip'){if(study){study.flip=!study.flip;drawStudy()}}
  else if(act==='got'||act==='again'){const ok=act==='got',k=study.q.shift();grade(cardOf(k),ok);if(ok){study.done++;study.right++}else{study.q.push(k);study.wrong++}study.flip=false;drawStudy()}
  else if(act==='pick'){const s=study;if(s.pick)return;const ok=s.opts[+i].ok;grade(cardOf(s.q[0]),ok);if(ok){s.done++;s.right++}else s.wrong++;s.pick={i:+i,ok};drawStudy()}
  else if(act==='next'){const s=study,k=s.q.shift();if(!s.pick.ok)s.q.push(k);s.pick=null;s.opts=null;drawStudy()}
  else if(act==='resetprog'){if(await confirmBox('Reset study progress for every card in this deck?')){const d=await get('decks',id);d.cards.forEach(c=>{c.box=0;c.due=0;c.seen=0;c.right=0});await put('decks',d);deckView(id)}}
  else if(act==='nread'){const n=NOTIFS.find(x=>x.id===id);if(n&&!n.read){n.read=true;put('notifications',n);paintBell()}}
  else if(act==='ndismiss'){const n=NOTIFS.find(x=>x.id===id);if(n){n.read=true;n.dismissed=true;await put('notifications',n);paintBell()}}
  else if(act==='nreadall'){await Promise.all(NOTIFS.filter(n=>!n.read).map(n=>{n.read=true;return put('notifications',n)}));paintBell()}
  else if(act==='nclear'){await Promise.all(NOTIFS.filter(n=>!n.dismissed).map(n=>{n.read=true;n.dismissed=true;return put('notifications',n)}));paintBell()}
  else if(act==='newfolder'){const f={id:uid(),name:'',created:Date.now(),updated:Date.now()};await put('folders',f);location.hash='#/folder/'+f.id}
  else if(act==='movedeck'){await moveDeck(id)}
  else if(act==='delfolder'||act==='askdelf'){
    if(await confirmBox('Delete this folder? The decks inside are kept and move out of the folder.')){
      pending=null;clearTimeout(saveTimer);
      for(const d of (await all('decks')).filter(x=>x.folder===id)){d.folder=null;await put('decks',d)}
      await del('folders',id);
      if(act==='delfolder')location.hash='#/cards';else decksView();
    }
  }
  else if(CACT.includes(act)){convoAct(act,t)}
  else if(act==='newconvo'){const c={id:uid(),name:'',desc:'',script:'',created:Date.now(),updated:Date.now()};await put('convos',c);location.hash='#/convoedit/'+c.id}
  else if(act==='cstudy'){location.hash='#/convo/'+id}
  else if(act==='delconvo'||act==='askdelc'){
    if(await confirmBox('Delete this conversation?')){pending=null;clearTimeout(saveTimer);await del('convos',id);if(act==='delconvo')location.hash='#/convos';else convosView()}
  }
  else if(act==='newhabit'){const h={id:uid(),name:'',sched:ALLD,log:{},created:Date.now(),updated:Date.now()};await put('habits',h);location.hash='#/habit/'+h.id}
  else if(act==='hab'){const h=await get('habits',id);if(!h)return;const k=t.dataset.d;h.log=h.log||{};if(h.log[k])delete h.log[k];else h.log[k]=1;h.updated=Date.now();await put('habits',h);await refreshMult();render()}
  else if(act==='hsched'){const h=await get('habits',id),n=+t.dataset.n;let sc=h.sched&&h.sched.length?[...h.sched]:[...ALLD];sc=sc.includes(n)?sc.filter(x=>x!==n):[...sc,n];if(!sc.length)return;h.sched=sc;h.updated=Date.now();await put('habits',h);habitView(id)}
  else if(act==='hmonth'){hOff+=Number(t.dataset.n);habitView(id)}
  else if(act==='askdelh'){if(await confirmBox('Delete this habit and its history?')){await del('habits',id);habitsView()}}
  else if(act==='delhabit'){if(await confirmBox('Delete this habit and its history?')){pending=null;clearTimeout(saveTimer);await del('habits',id);location.hash='#/habits'}}
  else if(TACT.includes(act)){await testAct(act,t)}
  else if(WACT.includes(act)){await writeAct(act,t)}
  else if(act==='newnote'){const n={id:uid(),title:'',html:'',updated:Date.now()};await put('notes',n);location.hash='#/note/'+n.id}
  else if(act==='delnote'){if(await confirmBox('Delete this note? This cannot be undone.')){pending=null;clearTimeout(saveTimer);await del('notes',id);location.hash='#/notes'}}
  else if(act==='link'){const u=prompt('Link address (https://…)');if(u){document.getElementById('ed').focus();document.execCommand('createLink',false,u);document.getElementById('ed').dispatchEvent(new Event('input'))}}
  else if(act==='photo'){document.getElementById('pic').click()}
  else if(act==='export'){
    const k=t.dataset.kind,data=JSON.stringify({[k]:await all(k),...(k==='decks'?{folders:await all('folders')}:{})});
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
    a.download='toolbox-'+({decks:'flashcards',notes:'notes',habits:'habits',convos:'conversations'}[k])+'-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
  }
  else if(act==='import'){const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=async()=>{try{const j=JSON.parse(await inp.files[0].text());for(const f of j.folders||[])await put('folders',f);for(const d of j.decks||[])await put('decks',d);for(const n of j.notes||[])await put('notes',n);for(const h of j.habits||[])await put('habits',h);for(const c of j.convos||[])await put('convos',c);alert('Backup restored.');route()}catch{alert('That file is not a valid backup.')}};inp.click()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('flash'))e.target.click()});
</script>
</body>
</html>
